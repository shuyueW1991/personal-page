<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  <style>
    @page {
      size: A4;
      margin: 19mm 18mm 21mm;
    }

    html {
      background: #fff;
    }

    body {
      margin: 0;
      color: #111;
      background: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10.6pt;
      line-height: 1.58;
    }

    .cover {
      height: 245mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      page-break-after: always;
      text-align: center;
    }

    .cover img {
      display: block;
      width: 128mm;
      height: 128mm;
      object-fit: cover;
      margin: 0 auto 16mm;
      border: 1px solid #c5c5bd;
    }

    .cover .kicker {
      font-family: "Arial", sans-serif;
      font-size: 8pt;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #777;
      margin: 0 0 10mm;
    }

    .cover h1 {
      max-width: 150mm;
      margin: 0 auto;
      font-size: 25pt;
      font-weight: 400;
      line-height: 1.18;
      letter-spacing: -0.01em;
    }

    .cover .deck {
      margin: 8mm 0 0;
      font-style: italic;
      font-size: 12pt;
      color: #444;
    }

    .cover .meta {
      margin: 14mm 0 0;
      font-family: "Arial", sans-serif;
      font-size: 8pt;
      letter-spacing: 0.08em;
      color: #777;
    }

    h2 {
      page-break-before: always;
      margin: 0 0 8mm;
      padding: 0 0 5mm;
      border-bottom: 1px solid #c5c5bd;
      font-size: 19pt;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    h2:first-of-type {
      page-break-before: auto;
    }

    h3 {
      margin: 7mm 0 3mm;
      font-size: 12.5pt;
      font-weight: 600;
      line-height: 1.3;
    }

    p {
      margin: 0 0 1.15em;
      orphans: 3;
      widows: 3;
    }

    em { font-style: italic; }

    strong { font-weight: 600; }

    ul, ol {
      margin: 0 0 1.2em;
      padding-left: 1.4em;
    }

    li { margin: 0 0 0.35em; }

    blockquote {
      margin: 1.2em 0;
      padding-left: 5mm;
      border-left: 1px solid #c5c5bd;
      color: #555;
    }

    hr {
      margin: 8mm 0;
      border: 0;
      border-top: 1px solid #e3e3dd;
    }

    code {
      font-family: "SFMono-Regular", Menlo, monospace;
      font-size: 0.86em;
    }

    pre {
      page-break-inside: avoid;
      padding: 3mm 4mm;
      border: 1px solid #e3e3dd;
      background: #fafaf8;
      font-size: 8pt;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .math-display {
      display: block;
      margin: 1.15em 0;
      page-break-inside: avoid;
      overflow: visible;
      font-size: 0.88em;
    }

    .math-display .katex { font-size: 1em; }

    .math-inline { font-size: 0.94em; }

    .katex-display {
      margin: 0.4em 0;
      page-break-inside: avoid;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
      page-break-inside: avoid;
    }

    th, td {
      padding: 2mm 2.5mm;
      border-bottom: 1px solid #e3e3dd;
      text-align: left;
      vertical-align: top;
    }

    .draft-note {
      margin: 12mm 0 0;
      font-family: "Arial", sans-serif;
      font-size: 7.5pt;
      line-height: 1.6;
      color: #777;
    }
  </style>
</head>
<body>
  <section class="cover">
    <p class="kicker">A working draft · 2026</p>
    <img src="assets/plate-01.jpg" alt="Looking Up: a person stands at an opening in a stone wall, looking at the stars.">
    <h1>{{HEADING}}</h1>
    <p class="deck">{{DECK}}</p>
    <p class="meta">Shuyue Wang · 王舒悦</p>
    <p class="draft-note">
      This is a working draft. Chapter IV is being expanded; the HTML sample and
      future updates live at shuyuew1991.github.io/personal-page.
    </p>
  </section>

{{BODY}}
</body>
</html>
