<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mirror -->
  <path d="M 400 30 Q 460 100 400 170" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
  <line x1="50" y1="100" x2="400" y2="100" stroke="#333" stroke-width="1"/>
  <!-- P and F -->
  <circle cx="400" cy="100" r="3" fill="#006064"/>
  <text x="405" y="120" font-size="14">P</text>
  <circle cx="200" cy="100" r="3" fill="red"/>
  <text x="195" y="120" font-size="14">F</text>
  
  <!-- Region A (Car Rearview Mirror) -->
  <text x="100" y="50" font-size="12" fill="#555">A: 汽车后视镜</text>
  <line x1="100" y1="80" x2="100" y2="120" stroke="black" stroke-width="3"/>
  <line x1="100" y1="80" x2="380" y2="60" stroke="orange" stroke-width="1"/>
  <line x1="380" y1="60" x2="250" y2="40" stroke="orange" stroke-width="1"/> <!-- Reflected -->
  <line x1="100" y1="120" x2="380" y2="140" stroke="green" stroke-width="1"/>
  <line x1="380" y1="140" x2="250" y2="160" stroke="green" stroke-width="1"/> <!-- Reflected -->
  
  <!-- Virtual rays -->
  <line x1="380" y1="60" x2="450" y2="40" stroke="orange" stroke-width="1" stroke-dasharray="4"/>
  <line x1="380" y1="140" x2="450" y2="160" stroke="green" stroke-width="1" stroke-dasharray="4"/>
  
  <!-- Virtual Image -->
  <line x1="450" y1="70" x2="450" y2="130" stroke="green" stroke-width="3" stroke-dasharray="5"/>
  <text x="455" y="145" font-size="10" fill="green">虚像(正立缩小)</text>
</svg>