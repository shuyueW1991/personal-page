<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mirror -->
  <path d="M 400 30 Q 340 100 400 170" fill="#e0f7fa" stroke="#006064" stroke-width="2"/>
  <line x1="50" y1="100" x2="400" y2="100" stroke="#333" stroke-width="1"/>
  <!-- F -->
  <circle cx="250" cy="100" r="3" fill="red"/>
  <text x="245" y="120" font-size="14">F</text>
  <circle cx="400" cy="100" r="3" fill="#006064"/>
  <text x="405" y="120" font-size="14">P</text>
  
  <!-- Region A (Telescope) -->
  <text x="100" y="50" font-size="12" fill="#555">A: 望远镜主镜</text>
  <line x1="100" y1="80" x2="100" y2="120" stroke="black" stroke-width="3"/>
  <line x1="100" y1="80" x2="380" y2="80" stroke="orange" stroke-width="1"/>
  <line x1="380" y1="80" x2="200" y2="150" stroke="orange" stroke-width="1"/>
  <line x1="100" y1="120" x2="380" y2="120" stroke="green" stroke-width="1"/>
  <line x1="380" y1="120" x2="200" y2="50" stroke="green" stroke-width="1"/>
  <line x1="200" y1="50" x2="200" y2="150" stroke="black" stroke-width="3"/>
  <text x="150" y="170" font-size="10" fill="black">实像(倒立)</text>

  <!-- Region B (Makeup Mirror) -->
  <text x="280" y="60" font-size="12" fill="#555">B: 化妆镜</text>
  <line x1="320" y1="90" x2="320" y2="110" stroke="black" stroke-width="3"/>
  <line x1="320" y1="90" x2="380" y2="80" stroke="orange" stroke-width="1"/>
  <line x1="380" y1="80" x2="200" y2="40" stroke="orange" stroke-width="1"/> <!-- Reflected -->
  <line x1="320" y1="110" x2="380" y2="120" stroke="green" stroke-width="1"/>
  <line x1="380" y1="120" x2="200" y2="160" stroke="green" stroke-width="1"/> <!-- Reflected -->
  
  <!-- Virtual Image Behind Mirror -->
  <line x1="450" y1="50" x2="450" y2="150" stroke="green" stroke-width="3" stroke-dasharray="5"/>
  <text x="455" y="160" font-size="10" fill="green">虚像(正立放大)</text>
</svg>