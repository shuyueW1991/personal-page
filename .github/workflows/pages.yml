name: Deploy site

# 只在 main 上构建；_site/ 是 build.py 现场装配出来的，
# 不进仓库，所以线上内容和白名单永远一致。
on:
  push:
    branches: [main]
  # 每 6 小时重跑一次：访客统计的快照跟着刷新。GitHub 的 cron 只是"尽量准时"。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: python3 build.py

      - name: Visitor stats snapshot
        # token 只放在仓库 secret 里，永远不会进 _site 或仓库。
        # 没配置时脚本会写 enabled:false 占位，站点照常发布；
        # 接口出错则这一步失败、不部署，线上继续保留上一份数字。
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 tools/stats_snapshot.py --out _site/stats.json

      - name: Verify nothing private got in
        # 双保险：artifact 里只要出现稿件/脚本，这一步就红。
        run: |
          if find _site -type f \( -iname '*.docx' -o -iname '*.doc' -o -iname '*.pdf' \
               -o -iname '*.xlsx' -o -iname '*.py' -o -iname '*.pyc' \) | grep .; then
            echo "::error::_site 里出现了不该上线的文件"
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
